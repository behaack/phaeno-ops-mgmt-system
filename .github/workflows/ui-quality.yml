name: Portal UI quality

on:
  pull_request:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portal-ui-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm ui:test
      - run: python ../deployment/hetzner/green/test-ui-quality-gate.py
      - run: pnpm ui:coverage:check
      - run: pnpm ui:test:components
      - run: pnpm ui:visual:check
      - run: pnpm lint:ci
      - run: pnpm typecheck
      - run: pnpm docs:check
      - run: pnpm docs:captures:check
      - run: pnpm ui:gallery:build
      - run: pnpm build
      - run: pnpm ui:build:check
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm ui:test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portal-ui-gallery-evidence
          path: frontend/test-results/ui-gallery
          if-no-files-found: ignore
          retention-days: 7

  visual-baselines:
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      - run: pnpm ui:test:visual
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portal-page-visual-diffs
          path: frontend/test-results/ui-visual
          if-no-files-found: ignore
          retention-days: 7

  workflow-behavior:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps firefox webkit
      - run: pnpm ui:test:cross-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portal-workflow-browser-evidence
          path: frontend/test-results/ui-cross-browser
          if-no-files-found: ignore
          retention-days: 7
