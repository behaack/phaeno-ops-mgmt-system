# Managed POMS scanner. Keep these limits aligned with the runtime installer.
DatabaseDirectory /var/lib/clamav
FailIfCvdOlderThan 3
LocalSocket /tmp/clamd.sock
LocalSocketMode 660
TCPSocket 3310
TCPAddr 0.0.0.0
User clamav
Foreground yes
LogTime yes
LogFile /var/log/clamav/clamd.log
LogFileMaxSize 5M
LogRotate yes
LogClean no
SelfCheck 60
ConcurrentDatabaseReload no
MaxThreads 2
MaxQueue 4
MaxConnectionQueueLength 16
CommandReadTimeout 30
ReadTimeout 120
StreamMaxLength 100M
MaxFileSize 100M
MaxScanSize 400M
MaxScanTime 90000
MaxRecursion 16
MaxFiles 10000
HeuristicAlerts yes
AlertExceedsMax yes
AlertEncrypted yes
ScanArchive yes
ScanPE yes
ScanELF yes
ScanOLE2 yes
ScanPDF yes
ScanHTML yes
ScanSWF yes
ScanXMLDOCS yes
ScanHWP3 yes
Bytecode yes
